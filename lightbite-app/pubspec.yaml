name: lightbite_app
description: "LightBite - Food delivery platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  flutter_bloc: ^9.1.0
  hydrated_bloc: ^11.0.0

  # Functional programming
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^8.0.3

  # Router
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # WebSocket
  web_socket_channel: ^3.0.2

  # Storage
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.6
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Connectivity
  connectivity_plus: ^6.1.4

  # Environment
  flutter_dotenv: ^5.2.1

  # Crash reporting
  sentry_flutter: ^8.14.2

  # Event bus
  event_bus: ^2.0.1

  # Code Generation Models
  # (no code generation — using Dart 3 sealed classes with equatable)

  # Images
  cached_network_image: ^3.4.1

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0

  # Value equality
  equatable: ^2.0.7
  google_maps_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  generate: true

  assets:
    - .env
